<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 数据处理刷题应用</title>
    <style>
        /* ===== 全局重置与变量 ===== */
        :root {
            --primary: #4f7cff;
            --primary-dark: #3a63d8;
            --primary-light: #eaf0ff;
            --success: #2bb673;
            --success-light: #e6f7ef;
            --danger: #f0554a;
            --danger-light: #fdeceb;
            --warning: #f5a623;
            --text-main: #1f2330;
            --text-sub: #6b7180;
            --text-light: #9aa0b0;
            --bg-page: #f4f6fb;
            --bg-card: #ffffff;
            --border: #e8ebf2;
            --shadow: 0 4px 20px rgba(31, 35, 48, 0.06);
            --shadow-hover: 0 8px 28px rgba(31, 35, 48, 0.12);
            --radius: 14px;
            --radius-sm: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-page);
            color: var(--text-main);
            line-height: 1.6;
            font-size: 15px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app {
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* ===== 屏幕切换 ===== */
        .screen {
            display: none;
            flex: 1;
            flex-direction: column;
            animation: fadeIn 0.3s ease;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hidden {
            display: none !important;
        }

        /* ===== 开始页 ===== */
        #start-screen {
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .start-card {
            width: 100%;
            max-width: 520px;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 36px 28px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .app-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        .app-subtitle {
            margin-top: 8px;
            color: var(--text-sub);
            font-size: 14px;
        }

        .stats-row {
            display: flex;
            justify-content: space-around;
            margin: 28px 0 24px;
            padding: 18px 0;
            background: var(--primary-light);
            border-radius: var(--radius);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-num {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            margin-top: 4px;
            font-size: 12px;
            color: var(--text-sub);
        }

        .filter-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .filter-title {
            font-size: 14px;
            color: var(--text-sub);
            font-weight: 500;
            margin-bottom: 10px;
        }

        .filter-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .filter-btn {
            padding: 12px 14px;
            background: var(--bg-page);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-main);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .filter-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        /* ===== 按钮 ===== */
        .primary-btn {
            width: 100%;
            padding: 14px 20px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            font-family: inherit;
        }

        .primary-btn:hover {
            background: var(--primary-dark);
        }

        .primary-btn:active {
            transform: scale(0.98);
        }

        .primary-btn:disabled {
            background: var(--text-light);
            cursor: not-allowed;
        }

        .ghost-btn {
            width: 100%;
            padding: 14px 20px;
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            font-family: inherit;
        }

        .ghost-btn:hover {
            background: var(--primary-light);
        }

        .ghost-btn:disabled {
            color: var(--text-light);
            border-color: var(--border);
            cursor: not-allowed;
            background: transparent;
        }

        .text-btn {
            background: transparent;
            border: none;
            color: var(--primary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 10px;
            font-family: inherit;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: background 0.2s ease;
        }

        .icon-btn:hover {
            background: var(--bg-page);
        }

        /* ===== 答题页 ===== */
        #quiz-screen {
            max-width: 760px;
            margin: 0 auto;
            width: 100%;
        }

        .quiz-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .type-label {
            font-size: 13px;
            color: var(--primary);
            font-weight: 600;
        }

        .counter {
            font-size: 12px;
            color: var(--text-light);
        }

        .progress-wrap {
            height: 4px;
            background: var(--border);
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .question-area {
            flex: 1;
            padding: 20px 18px 100px;
            overflow-y: auto;
        }

        .question-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 22px 20px;
            box-shadow: var(--shadow);
        }

        .question-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .q-index {
            font-size: 13px;
            color: var(--text-light);
            font-weight: 500;
        }

        .q-type-tag {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 12px;
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }

        .q-type-tag.multi {
            background: #fff4e6;
            color: #f5a623;
        }

        .q-type-tag.judge {
            background: var(--success-light);
            color: var(--success);
        }

        .question-text {
            font-size: 16px;
            line-height: 1.7;
            color: var(--text-main);
            margin-bottom: 18px;
            word-break: break-word;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-item {
            display: flex;
            align-items: flex-start;
            padding: 14px 14px;
            background: var(--bg-page);
            border: 2px solid transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.18s ease;
            user-select: none;
        }

        .option-item:hover {
            background: #eef2fb;
        }

        .option-item.selected {
            background: var(--primary-light);
            border-color: var(--primary);
        }

        .option-item.selected .option-marker {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .option-marker {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid var(--border);
            color: var(--text-sub);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            margin-right: 12px;
            transition: all 0.18s ease;
        }

        .option-text {
            flex: 1;
            font-size: 15px;
            line-height: 1.55;
            color: var(--text-main);
            padding-top: 3px;
            word-break: break-word;
        }

        /* 答题后状态 */
        .question-card.revealed .option-item {
            cursor: default;
        }

        .question-card.revealed .option-item:hover {
            background: var(--bg-page);
        }

        .option-item.correct {
            background: var(--success-light);
            border-color: var(--success);
        }

        .option-item.correct .option-marker {
            background: var(--success);
            color: #fff;
            border-color: var(--success);
        }

        .option-item.wrong {
            background: var(--danger-light);
            border-color: var(--danger);
        }

        .option-item.wrong .option-marker {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
        }

        .answer-hint {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            line-height: 1.6;
        }

        .answer-hint.correct {
            background: var(--success-light);
            color: var(--success);
        }

        .answer-hint.wrong {
            background: var(--danger-light);
            color: var(--danger);
        }

        .quiz-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 760px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px));
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            z-index: 10;
        }

        .quiz-footer .ghost-btn,
        .quiz-footer .primary-btn {
            flex: 1;
        }

        /* ===== 结果页 ===== */
        #result-screen {
            align-items: center;
            padding: 24px 18px;
        }

        .result-card {
            width: 100%;
            max-width: 520px;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 36px 28px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .result-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
        }

        .score-circle {
            margin: 22px 0;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: conic-gradient(var(--primary) 0deg, var(--primary) 0deg, var(--border) 0deg, var(--border) 360deg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        .score-circle::before {
            content: "";
            position: absolute;
            inset: 10px;
            background: var(--bg-card);
            border-radius: 50%;
        }

        .score-text {
            font-size: 40px;
            font-weight: 700;
            color: var(--primary);
            line-height: 1;
            position: relative;
            z-index: 1;
        }

        .score-total {
            font-size: 14px;
            color: var(--text-sub);
            margin-top: 4px;
            position: relative;
            z-index: 1;
        }

        .result-meta {
            display: flex;
            justify-content: space-around;
            margin-bottom: 24px;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .meta-label {
            font-size: 12px;
            color: var(--text-sub);
        }

        .meta-value {
            margin-top: 4px;
            font-size: 20px;
            font-weight: 700;
        }

        .meta-value.correct {
            color: var(--success);
        }

        .meta-value.wrong {
            color: var(--danger);
        }

        .meta-value.skipped {
            color: var(--text-light);
        }

        .result-actions {
            display: flex;
            gap: 10px;
        }

        .result-actions .primary-btn,
        .result-actions .ghost-btn {
            flex: 1;
        }

        /* ===== 解析列表 ===== */
        .review-list {
            width: 100%;
            max-width: 760px;
            margin: 20px auto 40px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .review-item {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 18px 18px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--border);
        }

        .review-item.correct {
            border-left-color: var(--success);
        }

        .review-item.wrong {
            border-left-color: var(--danger);
        }

        .review-item.skipped {
            border-left-color: var(--text-light);
        }

        .review-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .review-head-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .review-num {
            font-size: 13px;
            color: var(--text-light);
            font-weight: 500;
        }

        .review-type {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }

        .review-status {
            font-size: 12px;
            font-weight: 600;
        }

        .review-status.correct {
            color: var(--success);
        }

        .review-status.wrong {
            color: var(--danger);
        }

        .review-status.skipped {
            color: var(--text-light);
        }

        .review-question {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .review-options {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .review-option {
            display: flex;
            align-items: flex-start;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            background: var(--bg-page);
        }

        .review-option.correct {
            background: var(--success-light);
            color: var(--success);
        }

        .review-option.wrong {
            background: var(--danger-light);
            color: var(--danger);
        }

        .review-option .opt-marker {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid var(--border);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .review-option.correct .opt-marker {
            background: var(--success);
            color: #fff;
            border-color: var(--success);
        }

        .review-option.wrong .opt-marker {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
        }

        .review-option-text {
            flex: 1;
            word-break: break-word;
        }

        .review-explain {
            padding: 10px 12px;
            background: var(--primary-light);
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-main);
        }

        .review-explain .label {
            color: var(--primary);
            font-weight: 600;
            margin-right: 6px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            body {
                font-size: 14px;
            }

            .start-card {
                padding: 28px 20px;
            }

            .app-title {
                font-size: 24px;
            }

            .stats-row {
                padding: 14px 0;
            }

            .stat-num {
                font-size: 20px;
            }

            .filter-buttons {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .filter-btn {
                padding: 10px 8px;
                font-size: 13px;
            }

            .question-area {
                padding: 16px 14px 100px;
            }

            .question-card {
                padding: 18px 16px;
            }

            .question-text {
                font-size: 15px;
            }

            .option-item {
                padding: 12px 12px;
            }

            .option-text {
                font-size: 14px;
            }

            .quiz-header {
                padding: 12px 14px;
            }

            .quiz-footer {
                padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
            }

            .result-card {
                padding: 28px 20px;
            }

            .score-circle {
                width: 120px;
                height: 120px;
            }

            .score-text {
                font-size: 34px;
            }

            .review-list {
                padding: 0 4px;
            }

            .review-item {
                padding: 14px 14px;
            }
        }

        @media (max-width: 360px) {
            .filter-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <!-- 开始页 -->
        <section id="start-screen" class="screen active">
            <div class="start-card">
                <h1 class="app-title">AI 数据处理刷题</h1>
                <p class="app-subtitle">数据标注 · 数据清洗 · 机器学习 · 职业素养题库</p>
                <div class="stats-row">
                    <div class="stat-item">
                        <span class="stat-num" id="stat-single">210</span>
                        <span class="stat-label">单选题</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-num" id="stat-judge">90</span>
                        <span class="stat-label">判断题</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-num" id="stat-total">300</span>
                        <span class="stat-label">总题数</span>
                    </div>
                </div>
                <div class="filter-group">
                    <h3 class="filter-title">请选择题库</h3>
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-type="all">全部题目</button>
                        <button class="filter-btn" data-type="single">单选题</button>
                        <button class="filter-btn" data-type="judge">判断题</button>
                    </div>
                </div>
                <button id="start-btn" class="primary-btn">开始答题</button>
            </div>
        </section>

        <!-- 答题页 -->
        <section id="quiz-screen" class="screen">
            <header class="quiz-header">
                <button id="back-btn" class="icon-btn" title="返回首页" aria-label="返回首页">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5M12 19l-7-7 7-7" />
                    </svg>
                </button>
                <div class="header-info">
                    <span id="quiz-type-label" class="type-label">单选题</span>
                    <span id="quiz-counter" class="counter">1 / 300</span>
                </div>
                <button id="submit-top-btn" class="text-btn">交卷</button>
            </header>

            <div class="progress-wrap">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <main class="question-area">
                <div class="question-card">
                    <div class="question-head">
                        <span id="q-index" class="q-index">第 1 题</span>
                        <span id="q-type-tag" class="q-type-tag">单选题</span>
                    </div>
                    <p id="question-text" class="question-text"></p>
                    <div id="options-list" class="options-list"></div>
                </div>

                <div id="answer-hint" class="answer-hint hidden">本题已作答</div>
            </main>

            <footer class="quiz-footer">
                <button id="prev-btn" class="ghost-btn">上一题</button>
                <button id="next-btn" class="primary-btn">下一题</button>
            </footer>
        </section>

        <!-- 结果页 -->
        <section id="result-screen" class="screen">
            <div class="result-card">
                <h1 class="result-title">答题完成</h1>
                <div class="score-circle">
                    <span id="score-text" class="score-text">0</span>
                    <span class="score-total">/ <span id="score-total">0</span></span>
                </div>
                <div class="result-meta">
                    <div class="meta-item">
                        <span class="meta-label">正确</span>
                        <span id="meta-correct" class="meta-value correct">0</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">错误</span>
                        <span id="meta-wrong" class="meta-value wrong">0</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">未答</span>
                        <span id="meta-skipped" class="meta-value skipped">0</span>
                    </div>
                </div>
                <div class="result-actions">
                    <button id="review-btn" class="primary-btn">查看解析</button>
                    <button id="restart-btn" class="ghost-btn">再来一次</button>
                </div>
            </div>

            <div id="review-list" class="review-list hidden"></div>
        </section>
    </div>

    <script>
        /* ==========================================================================
           AI 数据处理刷题应用
           题目数据严格按 题目信息_整理版.txt 顺序排列，不做随机打乱
           ========================================================================== */

        /* ---------- 题目数据 ---------- */
        // type: single=单选, multi=多选, judge=判断
        // answer: 单选/判断为单字母字符串；多选为字母数组

            { type: 'judge', stem: '智能交互技术在工业设计中可实现应用于生理状态信息监控。', options: ['正确', '错误'], answer: 'A' },
            { type: 'judge', stem: '在数据标注项目中，项目经理的角色仅限于管理预算，不涉及标注过程的监督。', options: ['正确', '错误'], answer: 'B' },
            { type: 'judge', stem: '受极端变量值影响的集中趋势的度量指标是分位数和算术平均数。', options: ['正确', '错误'], answer: 'B' },
            { type: 'judge', stem: '基于数据源的脏数据分类的数据质量问题可以分为单数据源问题和多数据源问题。', options: ['正确', '错误'], answer: 'A' },
            { type: 'judge', stem: '有效语音的判定不需要考虑语音的背景噪声水平。', options: ['正确', '错误'], answer: 'B' },
            { type: 'judge', stem: '数据清洗内容包括缺失值处理、异常值处理、去重处理和噪音数据处理。', options: ['正确', '错误'], answer: 'A' },
            { type: 'judge', stem: '数据缺失值的处理方法包括删除含有缺失值的个案、补全、真值转换、不处理。', options: ['正确', '错误'], answer: 'A' },
            { type: 'judge', stem: '缺失值一般由NA表示。', options: ['正确', '错误'], answer: 'A' },
            { type: 'judge', stem: '神经网络也被称作人工神经网络或连接模型，它是一种模仿动物神经网络行为特征，进行分布式并行信息处理的算法数学模型。', options: ['正确', '错误'], answer: 'A' },
            { type: 'judge', stem: '在数据标注流程中，标注工具的选择对标注效率和质量有重要影响。', options: ['正确', '错误'], answer: 'A' },
            { type: 'judge', stem: '算法的最坏情况时间复杂度总是比最好情况时间复杂度更能反映算法的实际性能。', options: ['正确', '错误'], answer: 'B' },
            { type: 'judge', stem: '企业在追求利润的同时，可以忽视职业道德的建设。', options: ['正确', '错误'], answer: 'B' },
            { type: 'judge', stem: '常见的数据可视化图表类型有柱形图、条形图、饼图和折线图。', options: ['正确', '错误'], answer: 'A' },
            { type: 'judge', stem: '人机界面设计包括软件构件之间的接口、模块与其他非人的信息生产者和消费者的界面、人和计算机间的界面。', options: ['正确', '错误'], answer: 'A' },
            { type: 'judge', stem: '在AI数据处理架构中，数据存储库是数据的最终存储地，不参与数据转换过程。', options: ['正确', '错误'], answer: 'B' },
            { type: 'judge', stem: '日志数据解析问题定位方法不适用于高并发系统，因为日志数据的量太大，无法处理。', options: ['正确', '错误'], answer: 'B' },
            { type: 'judge', stem: '编写详细大纲不是编写培训讲义的重要步骤，因为它不会影响最终内容的结构和逻辑连贯性。', options: ['正确', '错误'], answer: 'B' },
            { type: 'judge', stem: '语音标注规则可以根据标注员的个人习惯灵活调整。', options: ['正确', '错误'], answer: 'B' },
            { type: 'judge', stem: '回归分析中，只包括一个自变量和一个因变量，且二者的关系可用一条直线近似表示，这种回归分析称为一元线性回归分析。', options: ['正确', '错误'], answer: 'A' },
            { type: 'judge', stem: '在模型训练中，早停法是一种有效的策略，可以防止模型在训练集上过度优化。', options: ['正确', '错误'], answer: 'A' },
            { type: 'judge', stem: '在进行人工智能业务模块分析时，模块之间的接口问题对系统性能影响较小。', options: ['正确', '错误'], answer: 'B' },
            { type: 'judge', stem: '数据标注只对机器学习模型的训练阶段重要。', options: ['正确', '错误'], answer: 'B' },
            { type: 'judge', stem: '神经网络通常由输入层、隐藏层、输出层和损失层四部分组成。', options: ['正确', '错误'], answer: 'B' },
            { type: 'judge', stem: '数据分析的目的是发现数据中的模式和关联，以便做出决策。', options: ['正确', '错误'], answer: 'A' },
            { type: 'judge', stem: '多重抽样检验的缺点则是该方法只能用于辅助其他检验方法。', options: ['正确', '错误'], answer: 'B' },
            { type: 'judge', stem: '在数据采集系统维护中，数据的完整性和准确性是维护工作的重点之一。', options: ['正确', '错误'], answer: 'A' },
            { type: 'judge', stem: '交互设计大师Donald Norman提出了十条启发式设计原则。', options: ['正确', '错误'], answer: 'B' },
        ];

        /* ---------- 全局状态 ---------- */
        const state = {
            selectedType: 'all',     // 用户选择的题库类型
            pool: [],                // 当前答题池（按顺序）
            userAnswers: [],         // 用户作答，未答为 null
            currentIndex: 0,         // 当前题号
            submitted: false,        // 是否已交卷
        };

        /* ---------- DOM 引用 ---------- */
        const $ = (id) => document.getElementById(id);
        const screens = {
            start: $('start-screen'),
            quiz: $('quiz-screen'),
            result: $('result-screen'),
        };

        /* ---------- 工具函数 ---------- */
        const TYPE_LABELS = { single: '单选题', multi: '多选题', judge: '判断题' };
        const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

        function buildPool(type) {
            // 题目顺序严格遵循原始文件顺序，不打乱
            if (type === 'all') {
                return QUESTIONS.slice();
            }
            return QUESTIONS.filter(q => q.type === type);
        }

        function normalizeAnswer(ans) {
            if (ans == null) return [];
            if (Array.isArray(ans)) return ans.slice().sort();
            return [ans];
        }

        function isAnswered(idx) {
            const a = state.userAnswers[idx];
            if (a == null) return false;
            if (Array.isArray(a)) return a.length > 0;
            return true;
        }

        function isCorrect(idx) {
            const q = state.pool[idx];
            const userAns = normalizeAnswer(state.userAnswers[idx]);
            const rightAns = normalizeAnswer(q.answer);
            if (userAns.length !== rightAns.length) return false;
            return userAns.every((v, i) => v === rightAns[i]);
        }

        function escapeHtml(str) {
            // 将文本转为安全 HTML，避免 <meta>、<img> 等被当作真标签解析
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        /* ---------- 屏幕切换 ---------- */
        function showScreen(name) {
            Object.values(screens).forEach(s => s.classList.remove('active'));
            screens[name].classList.add('active');
            window.scrollTo(0, 0);
        }

        /* ---------- 开始页初始化 ---------- */
        function initStartScreen() {
            const counts = {
                single: QUESTIONS.filter(q => q.type === 'single').length,
                judge: QUESTIONS.filter(q => q.type === 'judge').length,
            };
            $('stat-single').textContent = counts.single;
            $('stat-judge').textContent = counts.judge;
            $('stat-total').textContent = QUESTIONS.length;

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.selectedType = btn.dataset.type;
                });
            });

            $('start-btn').addEventListener('click', startQuiz);
        }

        /* ---------- 开始答题 ---------- */
        function startQuiz() {
            state.pool = buildPool(state.selectedType);
            state.userAnswers = state.pool.map(() => null);
            state.currentIndex = 0;
            state.submitted = false;
            showScreen('quiz');
            renderQuestion();
        }

        /* ---------- 渲染当前题目 ---------- */
        function renderQuestion() {
            const idx = state.currentIndex;
            const q = state.pool[idx];
            const total = state.pool.length;

            // 顶部信息
            $('quiz-type-label').textContent = TYPE_LABELS[q.type];
            $('quiz-counter').textContent = `${idx + 1} / ${total}`;
            $('progress-bar').style.width = `${((idx + 1) / total) * 100}%`;

            // 题目卡片
            $('q-index').textContent = `第 ${idx + 1} 题`;
            const tag = $('q-type-tag');
            tag.textContent = TYPE_LABELS[q.type];
            tag.className = 'q-type-tag ' + q.type;
            $('question-text').textContent = q.stem;

            // 选项
            const optionsList = $('options-list');
            optionsList.innerHTML = '';
            const userAns = state.userAnswers[idx];

            q.options.forEach((opt, i) => {
                const letter = LETTERS[i];
                const item = document.createElement('div');
                item.className = 'option-item';
                item.dataset.letter = letter;

                const marker = document.createElement('span');
                marker.className = 'option-marker';
                marker.textContent = letter;

                const text = document.createElement('span');
                text.className = 'option-text';
                text.textContent = opt;  // textContent 安全，不会被解析为 HTML

                item.appendChild(marker);
                item.appendChild(text);

                // 已选状态回显
                if (userAns != null) {
                    if (Array.isArray(userAns) ? userAns.includes(letter) : userAns === letter) {
                        item.classList.add('selected');
                    }
                }

                // 交卷后显示正误
                if (state.submitted) {
                    const rightAns = normalizeAnswer(q.answer);
                    if (rightAns.includes(letter)) {
                        item.classList.add('correct');
                    } else if (item.classList.contains('selected')) {
                        item.classList.add('wrong');
                    }
                    item.classList.remove('selected');
                } else {
                    item.addEventListener('click', () => onOptionClick(letter));
                }

                optionsList.appendChild(item);
            });

            // 卡片揭示状态
            const card = document.querySelector('.question-card');
            card.classList.toggle('revealed', state.submitted);

            // 答案提示（交卷后）
            const hint = $('answer-hint');
            if (state.submitted) {
                hint.classList.remove('hidden');
                const correct = isCorrect(idx);
                const userAnsStr = formatAnswer(userAns);
                const rightAnsStr = formatAnswer(q.answer);
                if (correct) {
                    hint.className = 'answer-hint correct';
                    hint.innerHTML = `<strong>回答正确</strong>　正确答案：${escapeHtml(rightAnsStr)}`;
                } else if (userAns == null || (Array.isArray(userAns) && userAns.length === 0)) {
                    hint.className = 'answer-hint wrong';
                    hint.innerHTML = `<strong>未作答</strong>　正确答案：${escapeHtml(rightAnsStr)}`;
                } else {
                    hint.className = 'answer-hint wrong';
                    hint.innerHTML = `<strong>回答错误</strong>　你的答案：${escapeHtml(userAnsStr)}　正确答案：${escapeHtml(rightAnsStr)}`;
                }
            } else {
                hint.classList.add('hidden');
            }

            // 底部按钮
            $('prev-btn').disabled = idx === 0;
            const nextBtn = $('next-btn');
            if (idx === total - 1) {
                nextBtn.textContent = state.submitted ? '查看结果' : '交卷';
            } else {
                nextBtn.textContent = '下一题';
            }
        }

        function formatAnswer(ans) {
            if (ans == null) return '—';
            if (Array.isArray(ans)) {
                if (ans.length === 0) return '—';
                return ans.slice().sort().join('');
            }
            return ans;
        }

        /* ---------- 选项点击 ---------- */
        function onOptionClick(letter) {
            if (state.submitted) return;
            const idx = state.currentIndex;
            const q = state.pool[idx];

            if (q.type === 'multi') {
                let cur = state.userAnswers[idx];
                if (!Array.isArray(cur)) cur = [];
                const pos = cur.indexOf(letter);
                if (pos >= 0) {
                    cur.splice(pos, 1);
                } else {
                    cur.push(letter);
                }
                state.userAnswers[idx] = cur.slice();
            } else {
                // single / judge
                state.userAnswers[idx] = letter;
            }
            renderQuestion();
        }

        /* ---------- 导航 ---------- */
        function goPrev() {
            if (state.currentIndex > 0) {
                state.currentIndex--;
                renderQuestion();
            }
        }

        function goNext() {
            const total = state.pool.length;
            if (state.currentIndex === total - 1) {
                // 最后一题
                if (state.submitted) {
                    showResult();
                } else {
                    submitQuiz();
                }
            } else {
                state.currentIndex++;
                renderQuestion();
            }
        }

        /* ---------- 交卷 ---------- */
        function submitQuiz() {
            const total = state.pool.length;
            const answered = state.userAnswers.filter((a, i) => isAnswered(i)).length;
            const unanswered = total - answered;
            const msg = unanswered > 0
                ? `还有 ${unanswered} 道题未作答，确认交卷吗？`
                : '确认交卷吗？';
            if (!window.confirm(msg)) return;

            state.submitted = true;
            renderQuestion();
            // 直接跳转结果页
            showResult();
        }

        /* ---------- 结果页 ---------- */
        function showResult() {
            const total = state.pool.length;
            let correct = 0, wrong = 0, skipped = 0;
            state.pool.forEach((_, i) => {
                if (!isAnswered(i)) {
                    skipped++;
                } else if (isCorrect(i)) {
                    correct++;
                } else {
                    wrong++;
                }
            });

            $('score-text').textContent = correct;
            $('score-total').textContent = total;
            $('meta-correct').textContent = correct;
            $('meta-wrong').textContent = wrong;
            $('meta-skipped').textContent = skipped;

            // 分数环
            const ratio = total > 0 ? correct / total : 0;
            const deg = ratio * 360;
            const circle = document.querySelector('.score-circle');
            circle.style.background = `conic-gradient(var(--primary) 0deg, var(--primary) ${deg}deg, var(--border) ${deg}deg, var(--border) 360deg)`;

            // 隐藏解析列表，等用户点击查看
            $('review-list').classList.add('hidden');
            $('review-list').innerHTML = '';

            showScreen('result');
        }

        /* ---------- 解析列表 ---------- */
        function renderReview() {
            const list = $('review-list');
            list.innerHTML = '';

            state.pool.forEach((q, i) => {
                const userAns = state.userAnswers[i];
                const answered = isAnswered(i);
                const correct = isCorrect(i);
                const status = answered ? (correct ? 'correct' : 'wrong') : 'skipped';
                const statusText = answered ? (correct ? '正确' : '错误') : '未答';

                const item = document.createElement('div');
                item.className = 'review-item ' + status;

                // 头部（题号、题型、状态）
                const head = document.createElement('div');
                head.className = 'review-head';

                const headLeft = document.createElement('div');
                headLeft.className = 'review-head-left';
                const numSpan = document.createElement('span');
                numSpan.className = 'review-num';
                numSpan.textContent = `第 ${i + 1} 题`;
                const typeSpan = document.createElement('span');
                typeSpan.className = 'review-type';
                typeSpan.textContent = TYPE_LABELS[q.type];
                headLeft.appendChild(numSpan);
                headLeft.appendChild(typeSpan);

                const statusSpan = document.createElement('span');
                statusSpan.className = 'review-status ' + status;
                statusSpan.textContent = statusText;

                head.appendChild(headLeft);
                head.appendChild(statusSpan);
                item.appendChild(head);

                // 题干（textContent 安全）
                const stem = document.createElement('div');
                stem.className = 'review-question';
                stem.textContent = q.stem;
                item.appendChild(stem);

                // 选项列表
                const opts = document.createElement('div');
                opts.className = 'review-options';
                const rightAns = normalizeAnswer(q.answer);
                q.options.forEach((opt, oi) => {
                    const letter = LETTERS[oi];
                    const optDiv = document.createElement('div');
                    const isRight = rightAns.includes(letter);
                    const isUserPick = Array.isArray(userAns) ? userAns.includes(letter) : userAns === letter;
                    let cls = 'review-option';
                    if (isRight) cls += ' correct';
                    else if (isUserPick) cls += ' wrong';
                    optDiv.className = cls;

                    // 用 DOM 方式构建，避免选项中的 HTML 标签被解析
                    const optMarker = document.createElement('span');
                    optMarker.className = 'opt-marker';
                    optMarker.textContent = letter;
                    const optTextEl = document.createElement('span');
                    optTextEl.className = 'review-option-text';
                    optTextEl.textContent = opt;  // textContent 安全

                    optDiv.appendChild(optMarker);
                    optDiv.appendChild(optTextEl);
                    opts.appendChild(optDiv);
                });
                item.appendChild(opts);

                // 解析说明（仅含答案字母，安全）
                const explain = document.createElement('div');
                explain.className = 'review-explain';
                const label1 = document.createElement('span');
                label1.className = 'label';
                label1.textContent = '正确答案：';
                const ans1 = document.createTextNode(formatAnswer(q.answer) + '　');
                const label2 = document.createElement('span');
                label2.className = 'label';
                label2.textContent = '你的答案：';
                const ans2 = document.createTextNode(formatAnswer(userAns));
                explain.appendChild(label1);
                explain.appendChild(ans1);
                explain.appendChild(label2);
                explain.appendChild(ans2);
                item.appendChild(explain);

                list.appendChild(item);
            });

            list.classList.remove('hidden');
            list.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        /* ---------- 事件绑定 ---------- */
        function bindEvents() {
            $('prev-btn').addEventListener('click', goPrev);
            $('next-btn').addEventListener('click', goNext);
            $('back-btn').addEventListener('click', () => {
                if (state.submitted) {
                    // 已交卷，直接返回首页
                    showScreen('start');
                } else if (window.confirm('返回首页将放弃当前答题进度，确认返回吗？')) {
                    showScreen('start');
                }
            });
            $('submit-top-btn').addEventListener('click', () => {
                if (state.submitted) {
                    showResult();
                } else {
                    submitQuiz();
                }
            });
            $('review-btn').addEventListener('click', renderReview);
            $('restart-btn').addEventListener('click', () => {
                showScreen('start');
            });

            // 键盘快捷键（PC 端）
            document.addEventListener('keydown', (e) => {
                if (!screens.quiz.classList.contains('active')) return;
                if (state.submitted) return;
                const q = state.pool[state.currentIndex];
                if (!q) return;

                // A/B/C/D 选择
                const key = e.key.toUpperCase();
                if (q.type === 'multi') {
                    if (['A', 'B', 'C', 'D'].includes(key) && LETTERS.indexOf(key) < q.options.length) {
                        onOptionClick(key);
                        e.preventDefault();
                    }
                } else if (q.type === 'judge') {
                    if (key === 'A' || key === 'B') {
                        onOptionClick(key);
                        e.preventDefault();
                    }
                } else {
                    if (['A', 'B', 'C', 'D'].includes(key) && LETTERS.indexOf(key) < q.options.length) {
                        onOptionClick(key);
                        e.preventDefault();
                    }
                }

                // 左右切换
                if (e.key === 'ArrowLeft' && state.currentIndex > 0) {
                    goPrev();
                    e.preventDefault();
                } else if (e.key === 'ArrowRight') {
                    goNext();
                    e.preventDefault();
                }
            });
        }

        /* ---------- 启动 ---------- */
        document.addEventListener('DOMContentLoaded', () => {
            initStartScreen();
            bindEvents();
        });
    </script>
